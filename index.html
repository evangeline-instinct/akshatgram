<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<style>:root{--bg:#fff;--fg:#000;--mute:#737373;--line:#dbdbdb;--soft:#efefef;--blue:#0095f6;--ring:conic-gradient(from 200deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:18px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.logo{font-family:"Grand Hotel","Snell Roundhand","Brush Script MT",cursive;font-size:29px;line-height:32px;letter-spacing:.2px}
.side{position:fixed;left:0;top:0;bottom:0;width:244px;border-right:1px solid var(--line);padding:8px 12px 20px;display:flex;flex-direction:column;background:#fff;z-index:20}
.side .logo{padding:25px 12px 16px;margin-bottom:19px;height:73px}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav a,.nav button{display:flex;align-items:center;gap:16px;padding:12px;border-radius:8px;font-size:16px;line-height:20px;text-align:left;width:100%}
.nav a:hover,.nav button:hover{background:#f2f2f2}
.nav .on{font-weight:700}
.nav .lbl{white-space:nowrap}
.nav .more{margin-top:auto}
.top,.bottom{display:none}
.main{margin-left:244px;min-height:100vh}
@media(max-width:1160px){.side{width:72px;align-items:center}.side .logo{display:none}.side::before{content:"";height:73px;flex:none;margin-bottom:19px}.nav .lbl{display:none}.nav a,.nav button{width:auto;padding:12px}.main{margin-left:72px}}
.ava{overflow:hidden;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:linear-gradient(135deg,#4f5bd5,#962fbf 45%,#d62976 75%,#fa7e1e);flex:none}
.ava img{width:100%;height:100%;object-fit:cover;display:block}.brand-logo{width:100%;height:100%;object-fit:contain;background:#fff;display:block}
.ring{border-radius:50%;padding:2px;background:var(--ring);flex:none;display:block}
.ring>span{display:block;border-radius:50%;padding:2px;background:#fff}
.ring.seen{background:#c7c7c7}
.home{display:flex;justify-content:center;gap:64px;padding:0 20px}
.col{width:100%;max-width:470px;padding-top:24px}
.rail{width:319px;padding-top:36px;flex:none}
@media(max-width:1000px){.rail{display:none}}
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 0 14px;margin-bottom:6px;scrollbar-width:none}
.stories::-webkit-scrollbar,.hl::-webkit-scrollbar{display:none}
.st{display:flex;flex-direction:column;align-items:center;gap:5px;width:66px;flex:none}
.st .ico{border-radius:50%;display:grid;place-items:center;background:#fafafa;border:1px solid var(--line)}
.st small{font-size:12px;color:#262626;width:66px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:16px}
.post{border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:20px}
.ph{display:flex;align-items:center;gap:10px;padding:0 0 12px}
.ph b{font-weight:600}
.ph .dot,.ph .time{color:var(--mute)}
.ph .sp{flex:1}
.ph .sub{font-size:12px;color:var(--mute);line-height:14px}
.art{position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:8%;user-select:none;container-type:inline-size;width:100%;height:100%}
.art .k{font-size:3.6cqw;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.art .g{font-size:26cqw;line-height:1;width:1em;filter:drop-shadow(0 .6cqw 1.2cqw rgba(0,0,0,.25))}
.art .t{font-size:9.4cqw;line-height:1.05;font-weight:800;letter-spacing:-.03em;white-space:pre-line}
.art .s{font-size:4.2cqw;line-height:1.3;opacity:.88;margin-top:2cqw;max-width:88%}
.art::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 8%,rgba(255,255,255,.22),transparent 45%);pointer-events:none}
.feedart{aspect-ratio:4/5;position:relative;overflow:hidden;border:1px solid var(--soft);border-radius:4px;cursor:pointer;background:#222}
.heart-pop{position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px;fill:#fff;opacity:0;pointer-events:none;transform:scale(.3);z-index:2;filter:drop-shadow(0 2px 12px rgba(0,0,0,.4))}
.heart-pop.go{animation:pop .85s ease}
@keyframes pop{0%{opacity:0;transform:scale(.3)}20%{opacity:1;transform:scale(1.15)}40%{transform:scale(.95)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.acts{display:flex;align-items:center;gap:16px;padding:6px 0 4px}
.acts .sp{flex:1}
.acts button,.acts a{padding:8px 0}
.acts button:hover svg{opacity:.55}
.liked svg{fill:#ff3040;stroke:#ff3040;animation:beat .35s}
@keyframes beat{50%{transform:scale(1.25)}}
.saved svg{fill:#000}
.likes{font-weight:600;margin:2px 0 8px}
.likes b{font-weight:700}
.cap{margin-bottom:6px;word-wrap:break-word}
.cap b{font-weight:600;margin-right:4px}
.cap a.tag,.cap a.lnk{color:#00376b}
.cmts div{margin-bottom:3px}
.cmts b{font-weight:600;margin-right:4px}
.addc{display:flex;align-items:center;gap:8px;padding:6px 0 10px}
.addc input{flex:1;border:0;outline:0;font:inherit;background:none;padding:0;min-width:0}
.addc button{color:var(--blue);font-weight:600;opacity:.4;pointer-events:none}
.addc.has button{opacity:1;pointer-events:auto}
.me{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.me .n,.sug .n{flex:1;min-width:0}
.me b,.sug b{font-weight:600;display:block}
.me span.d,.sug span{color:var(--mute);display:block;font-size:14px}
.btnlnk{color:var(--blue);font-weight:600;font-size:12px}
.btnlnk:hover{color:#00376b}
.rh{display:flex;justify-content:space-between;margin:6px 0 10px}
.rh span{color:var(--mute);font-weight:600}
.rh a{font-size:12px;font-weight:600}
.sug{display:flex;align-items:center;gap:12px;padding:8px 0}
.sug .ava{font-size:18px;border:1px solid #dbdbdb;box-sizing:border-box}

.rf{height:100vh;width:100%;max-width:440px;margin:0 auto;overflow-y:scroll;scroll-snap-type:y mandatory;background:#000;scrollbar-width:none;overscroll-behavior:contain}.rf::-webkit-scrollbar{display:none}
.rl{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;cursor:pointer;background:#000;-webkit-tap-highlight-color:transparent}
.rbg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(28px) brightness(.55)}
.rim{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:rkb 14s ease-in-out infinite alternate}
.rl.paused .rim{animation-play-state:paused}
@keyframes rkb{from{transform:scale(1)}to{transform:scale(1.07)}}
.rshade{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,rgba(0,0,0,.72));pointer-events:none}
.rmute{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:3}

const rlI={pause:'<svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>',play:'<svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>',mute:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z" fill="#fff"/><path d="m22 9-6 6M16 9l6 6"/></svg>',vol:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z" fill="#fff"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>'};
const reels=()=>`<div class="rf" id="rf">${RL.map((r,i)=>`<section class="rl" data-i="${i}" onclick="rlTap(${i})"><div class="rbg" style="background-image:url(${r.img})"></div><img class="rim" src="${r.img}" alt="${esc(r.t)}" ${i<2?'':'loading="lazy"'}><div class="rshade"></div><button class="rmute" onclick="event.stopPropagation();rlMute()" aria-label="Mute or unmute">${RS.muted?rlI.mute:rlI.vol}</button><div class="rflash" id="rfl-${i}"></div><div class="rcap"><div class="rwho">${ring(32)}<b>${ME.u}</b></div><div class="rt">${esc(r.t)}</div><div class="rsong">&#9835; ${esc(r.song)} &middot; Kevin MacLeod<br><a href="https://incompetech.com" target="_blank" rel="noopener" onclick="event.stopPropagation()">incompetech.com</a> &middot; <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener" onclick="event.stopPropagation()">CC BY 4.0</a></div></div><div class="rprog"><i id="rp-${i}"></i></div></section>`).join('')}</div>`;
function rlFlash(i,k){const e=document.getElementById('rfl-'+i);if(!e)return;e.innerHTML='<div>'+rlI[k]+'</div>';e.classList.remove('go');void e.offsetWidth;e.classList.add('go')}
function rlSet(i,play){document.querySelectorAll('.rl').forEach(el=>el.classList.toggle('paused',!(play&&+el.dataset.i===i)))}
function rlPlay(i){RS.i=i;const r=RL[i];if(RA.src!==r.url){RA.src=r.url}RA.currentTime=0;RA.muted=RS.muted;const p=RA.play();if(p&&p.catch)p.catch(()=>{rlSet(i,false);rlFlash(i,'play')});rlSet(i,true)}
function rlTap(i){if(RS.i!==i){rlPlay(i);return}if(RA.paused){RA.play().catch(()=>{});rlSet(i,true);rlFlash(i,'play')}else{RA.pause();rlSet(i,false);rlFlash(i,'pause')}}
function rlMute(){RS.muted=!RS.muted;RA.muted=RS.muted;document.querySelectorAll('.rmute').forEach(b=>b.innerHTML=RS.muted?rlI.mute:rlI.vol)}
RA.addEventListener('timeupdate',()=>{const e=document.getElementById('rp-'+RS.i);if(e&&RA.duration)e.style.width=(RA.currentTime/RA.duration*100)+'%'});
let rlIO=null;
function rlInit(){const rf=document.getElementById('rf');if(!rf)return;if(rlIO)rlIO.disconnect();
 rlIO=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting&&en.intersectionRatio>=.6){const i=+en.target.dataset.i;if(RS.i!==i)rlPlay(i)}})},{root:rf,threshold:[.6]});
 rf.querySelectorAll('.rl').forEach(el=>rlIO.observe(el));
 RS.i=-1;const st=RS.start||0;RS.start=null;if(st>0){const t=rf.querySelector('.rl[data-i="'+st+'"]');if(t)rf.scrollTop=t.offsetTop}else{rlPlay(0)}}
function rlStop(){try{RA.pause()}catch(e){}RS.i=-1;if(rlIO){rlIO.disconnect();rlIO=null}}

function like(id){S.like[id]=!S.like[id];persist();upd(id)}
function save(id){S.save[id]=!S.save[id];persist();upd(id);toast(S.save[id]?'Saved':'Removed from saved')}

function addC(id,inp){const v=inp.value.trim();if(!v)return;(S.cm[id]=S.cm[id]||[]).push(v);persist();inp.value='';inp.parentNode.classList.remove('has');document.querySelectorAll('#cm-'+id).forEach(e=>e.innerHTML=cmts(P.find(x=>x.id===id)));toast('Comment saved on this device')}

function copyLink(){try{navigator.clipboard.writeText(location.href.split('#')[0])}catch(e){}toast('Link copied')}
function openPost(id,silent){cur=id;const i=P.findIndex(p=>p.id===id),p=P[i];if(!p)return;const{acts,cap,add}=parts(p,true);
 $('#md').innerHTML=`<button class="xx" onclick="closePost()" aria-label="Close">${I.x}</button><div class="box" onclick="event.stopPropagation()"><div class="l" ondblclick="dbl2('${id}')">${art(p)}${i>0?`<button class="nv" style="left:12px" onclick="step(-1)" aria-label="Previous">${I.chevl}</button>`:''}${i<P.length-1?`<button class="nv" style="right:12px" onclick="step(1)" aria-label="Next">${I.chev}</button>`:''}${pop('m')}</div><div class="rr"><div class="ph">${ring(36)}<div><b>${ME.u}</b><div class="sub">${esc(p.k)}</div></div></div><div class="scr">${cap}<div class="cmts" id="cm-${id}" style="margin-top:14px">${cmts(p)}</div></div><div class="ft">${acts}<div class="likes" id="lk-${id}">${likesTxt(p)}</div>${add}</div></div></div>`;
 $('#md').classList.add('open');$('#md').onclick=closePost;document.body.style.overflow='hidden';
 if(!silent)history.pushState({},'','#/p/'+id)}
function dbl2(id){if(!S.like[id])like(id);const h=$('#hp-m');h.classList.remove('go');void h.getBoundingClientRect();h.classList.add('go')}
function step(d){const p=P[P.findIndex(p=>p.id===cur)+d];if(p){openPost(p.id,true);history.replaceState({},'','#/p/'+p.id)}}
function closePost(){$('#md').classList.remove('open');document.body.style.overflow='';if(location.hash.startsWith('#/p/'))history.replaceState({},'','#/'+(lastView==='home'?'':lastView||'profile'))}
let sid=null,si=0,tm=null,el=0,paused=false;const DUR=5000;
function openStory(id,i=0){sid=id;si=i;$('#sv').classList.add('open');document.body.style.overflow='hidden';seen[id]=1;localStorage.setItem('ab_seen',JSON.stringify(seen));slide()}
function slide(){const h=H.find(x=>x.id===sid),s=h.sl[si];
 $('#sv').innerHTML=`<span class="logo">akshatgram</span><button class="x" onclick="closeStory()" aria-label="Close">${I.x}</button><button class="arr l" onclick="prevS()" aria-label="Previous">${I.chevl}</button><button class="arr r" onclick="nextS()" aria-label="Next">${I.chev}</button>
 <div class="card" id="card"><div class="slide ${s.img?'pic':''}" style="background:linear-gradient(160deg,${h.bg[0]},${h.bg[1]})">${s.img?`<div class="bgb" style="background-image:url(${s.img})"></div><img class="sp${s.fit?' fit':''}" src="${s.img}" alt="">`:`<div class="g">${G(s.g)}</div>`}<div class="t">${esc(s.t)}</div><div class="s">${esc(s.s||'')}</div>${s.cta?`<a class="cta" href="${s.cta[1]}" target="_blank" rel="noopener">${esc(s.cta[0])} ${I.ext}</a>`:''}</div>
 <div class="bars">${h.sl.map((_,k)=>`<i><b id="b${k}" style="width:${k<si?100:0}%"></b></i>`).join('')}</div>
 <div class="hd">${ava(32)}${ME.u} <span>${esc(h.n)}</span></div>

 <div class="reply"><input placeholder="Reply to ${ME.u}…" onkeydown="if(event.key==='Enter'&&this.value.trim())location.href='${MAIL}?subject='+encodeURIComponent('Re: ${esc(h.n)}')+'&body='+encodeURIComponent(this.value)" onfocus="paused=true" onblur="paused=false"><a href="${MAIL}" style="color:#fff" aria-label="Send">${I.msg}</a></div></div>`;
 el=0;paused=false;clearInterval(tm);const bar=$('#b'+si);tm=setInterval(()=>{if(paused)return;el+=50;bar.style.width=Math.min(100,el/DUR*100)+'%';if(el>=DUR)nextS()},50);
 const c=$('#card');const hold=e=>{if(!e.target.closest('a,input,button'))paused=true},rel=()=>{paused=false};c.addEventListener('pointerdown',hold);c.addEventListener('pointerup',rel);c.addEventListener('pointerleave',rel)}
function nextS(){const h=H.find(x=>x.id===sid);if(si<h.sl.length-1){si++;slide()}else{const k=H.findIndex(x=>x.id===sid);k<H.length-1?openStory(H[k+1].id):closeStory()}}
function prevS(){if(si>0){si--;slide()}else{const k=H.findIndex(x=>x.id===sid);k>0?openStory(H[k-1].id,H[k-1].sl.length-1):slide()}}

function closePanels(){$('#srch').classList.remove('open');$('#nf').classList.remove('open')}

$('#sq').addEventListener('input',e=>fill(e.target.value));
function doNf(){const o=$('#nf').classList.contains('open');closePanels();if(o)return;$('#nf').innerHTML=`<h3>Notifications</h3><h4>This week</h4><div class="row"><div class="ico">${`<img class="brand-logo" src="${LOGOS.decoded}" alt="Decoded logo">`}</div><div><b style="display:inline">Decoded</b> has 300+ listening hours on Spotify.</div></div><h4 style="margin-top:20px">Earlier</h4><div class="row"><div class="ico">${G("cal")}</div><div>Want to chat? <a class="btnlnk" href="${CAL}" target="_blank" rel="noopener">Book 30 minutes</a></div></div>`;$('#nf').classList.add('open')}
document.addEventListener('click',e=>{if(!e.target.closest('#srch,#nf,#side,#bottom,#top'))closePanels()});
document.addEventListener('keydown',e=>{
 if($('#sv').classList.contains('open')){if(e.key==='Escape')closeStory();if(e.key==='ArrowRight')nextS();if(e.key==='ArrowLeft')prevS();return}
 if($('#md').classList.contains('open')){if(e.key==='Escape')closePost();if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);return}
 if(e.key==='Escape')closePanels()});

{const r=route();render();if(r.post)openPost(r.post,true);if(r.story)openStory(r.story)}
